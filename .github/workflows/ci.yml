name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Test (no Neo4j required; mock fixtures)
        env:
          NO_PROXY: 127.0.0.1,localhost
          no_proxy: 127.0.0.1,localhost
        run: python -m pytest tests -q

      - name: Single-source consistency (D-035)
        run: python knowledge_graph_output/05_scripts/verify_single_source.py

      - name: Privacy scan
        run: python knowledge_graph_output/05_scripts/12_privacy_scan.py
