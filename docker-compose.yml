# 云湃电商 AI 客服 · Neo4j 一键部署（知识图谱）
#
# 用法：
#   docker compose up -d            # 启动 Neo4j
#   docker compose exec neo4j bin/cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change-me} \
#     -f /var/lib/neo4j/import/kg/00_setup.cypher
#   （依次执行 01_load_nodes.cypher → 02_load_rels.cypher）
#
# 连接参数：
#   HTTP:  http://localhost:7474
#   Bolt:  bolt://localhost:7687
#   账号:  neo4j / ${NEO4J_PASSWORD:-change-me}（与 .env NEO4J_PASSWORD 同源）
#
# 导入文件挂载：knowledge_graph_output/04_import → /var/lib/neo4j/import/kg
# （Cypher 里 file:///kg/... 即指向该目录）

services:
  neo4j:
    image: neo4j:5-community
    container_name: yunpai-neo4j
    environment:
      # 密码统一走 .env（NEO4J_PASSWORD），compose 与 Settings 同源；
      # 本地开发默认 change-me，生产/验收必须通过 .env 覆盖
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change-me}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    ports:
      - "7474:7474"   # HTTP API
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # 导入文件：仓库 knowledge_graph_output/04_import → 容器 /var/lib/neo4j/import/kg
      - ./knowledge_graph_output/04_import:/var/lib/neo4j/import/kg:ro
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
