[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yunpai-ecommerce-agent"
version = "0.30.0"
description = "Lightweight modular ecommerce operations agent with LangGraph, typed tools, RAG, and virtual connectors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<50",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-sqlite>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.15,<8.0",
  "httpx2>=2.7,<3.0",
  "playwright>=1.40,<2.0",
  "pytest>=8.3,<9.0",
]

[project.scripts]
yunpai-agent = "ecommerce_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecommerce_agent = ["fixtures/*.json", "fixtures/prompt_templates.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 注意：不要加 -n 并行——SQLite 单文件库在并行下会锁竞争，实测 4 worker
# 反而更慢（20min vs 16min）且引入 "unable to open database file" 假失败。
# basetemp 不再硬编码（跨平台可复现）：由 tests/conftest.py 的 pytest_configure
# 读取 PYTEST_BASETEMP 环境变量注入；未设置时用系统临时目录（平台无关）。
addopts = "-v --tb=short"
